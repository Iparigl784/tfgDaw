services:
  web:
    container_name: meetng-web
    build: .
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ../:/var/www/html
    user: "${UID}:${GID}"
    environment:
      - COMPOSER_ALLOW_SUPERUSER=${COMPOSER_ALLOW_SUPERUSER}
    networks:
      - mi_network
    depends_on:
      - db

  db:
    container_name: meetng-db
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - mi_network
    volumes:
      - db_datameetng:/var/lib/mysql
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PMA_PORT}:80"
    networks:
      - mi_network
    depends_on:
      - db

networks:
  mi_network:
    name: meetng-network

volumes:
  db_datameetng: